<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="Inter, system-ui, sans-serif">
  <defs>
    <radialGradient id="stBg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#080d18"/>
    </radialGradient>
    <linearGradient id="stGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4b400"/>
      <stop offset="1" stop-color="#ffce45"/>
    </linearGradient>
    <filter id="stGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="stClip"><rect width="600" height="400" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#stClip)">
    <rect width="600" height="400" fill="url(#stBg)"/>
    <g stroke="#ffffff" stroke-opacity=".025">
      <path d="M0 100H600M0 200H600M0 300H600"/>
      <path d="M150 0V400M300 0V400M450 0V400"/>
    </g>

    <!-- shield -->
    <g transform="translate(300 196)">
      <path d="M0 -120 L92 -86 V 10 C 92 74, 44 112, 0 132 C -44 112, -92 74, -92 10 V -86 Z"
            fill="#0d1626" stroke="url(#stGold)" stroke-width="2" opacity=".97"/>
      <path d="M0 -98 L72 -71 V 8 C 72 60, 34 92, 0 108 C -34 92, -72 60, -72 8 V -71 Z"
            fill="none" stroke="#f4b400" stroke-opacity=".22" stroke-width="1" stroke-dasharray="4 5"/>
      <!-- inner nodes forming governed data -->
      <g stroke="#f4b400" stroke-opacity=".4" fill="none">
        <path d="M-40 -30 L0 -52 L40 -30 M-40 -30 L0 -6 L40 -30 M0 -52 V -6 M0 -6 V 44 M-40 -30 L-40 18 L0 44 L40 18 L40 -30 M-40 18 L0 -6 L40 18"/>
      </g>
      <g filter="url(#stGlow)">
        <circle cx="0" cy="-52" r="6" fill="#ffce45"/>
        <circle cx="-40" cy="-30" r="4.6" fill="#60a5fa"/>
        <circle cx="40" cy="-30" r="4.6" fill="#60a5fa"/>
        <circle cx="0" cy="-6" r="5" fill="#f4b400"/>
        <circle cx="-40" cy="18" r="4.2" fill="#2dd4bf"/>
        <circle cx="40" cy="18" r="4.2" fill="#2dd4bf"/>
        <circle cx="0" cy="44" r="5.4" fill="#ffce45"/>
      </g>
      <!-- check -->
      <circle cx="0" cy="84" r="15" fill="url(#stGold)"/>
      <path d="M-6 84 l4.5 4.5 L8 79" fill="none" stroke="#0a1220" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- orbiting chips -->
    <g font-size="9" font-weight="700">
      <rect x="52" y="96" width="108" height="26" rx="13" fill="#0d1626" stroke="#f4b400" stroke-opacity=".4"/>
      <text x="106" y="113" text-anchor="middle" fill="#f4b400">GOVERNANCE</text>
      <rect x="446" y="88" width="100" height="26" rx="13" fill="#0d1626" stroke="#60a5fa" stroke-opacity=".45"/>
      <text x="496" y="105" text-anchor="middle" fill="#60a5fa">DATA QUALITY</text>
      <rect x="60" y="282" width="88" height="26" rx="13" fill="#0d1626" stroke="#2dd4bf" stroke-opacity=".45"/>
      <text x="104" y="299" text-anchor="middle" fill="#2dd4bf">SECURITY</text>
      <rect x="446" y="276" width="102" height="26" rx="13" fill="#0d1626" stroke="#8a9ab5" stroke-opacity=".4"/>
      <text x="497" y="293" text-anchor="middle" fill="#8a9ab5">COMPLIANCE</text>
    </g>
    <!-- connectors -->
    <g stroke-linecap="round" fill="none" stroke-opacity=".25">
      <path d="M160 109 C 190 116, 200 126, 216 140" stroke="#f4b400"/>
      <path d="M446 101 C 420 110, 408 122, 392 138" stroke="#60a5fa"/>
      <path d="M148 295 C 178 288, 194 280, 212 264" stroke="#2dd4bf"/>
      <path d="M446 289 C 420 282, 406 272, 390 258" stroke="#8a9ab5"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="599" height="399" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
