<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <radialGradient id="aiBg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#080d18"/>
    </radialGradient>
    <radialGradient id="aiCore" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffce45"/>
      <stop offset=".55" stop-color="#f4b400"/>
      <stop offset="1" stop-color="#f4b400" stop-opacity="0"/>
    </radialGradient>
    <filter id="aiGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="aiClip"><rect width="600" height="400" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#aiClip)">
    <rect width="600" height="400" fill="url(#aiBg)"/>
    <g stroke="#ffffff" stroke-opacity=".025">
      <path d="M0 66H600M0 133H600M0 200H600M0 266H600M0 333H600"/>
      <path d="M100 0V400M200 0V400M300 0V400M400 0V400M500 0V400"/>
    </g>

    <!-- connection filaments -->
    <g stroke-linecap="round" fill="none">
      <path d="M300 200 C 220 160, 160 150, 96 118" stroke="#f4b400" stroke-opacity=".38" stroke-width="1.3"/>
      <path d="M300 200 C 240 240, 170 260, 110 292" stroke="#f4b400" stroke-opacity=".3" stroke-width="1.2"/>
      <path d="M300 200 C 250 130, 220 100, 178 62" stroke="#f4b400" stroke-opacity=".25" stroke-width="1"/>
      <path d="M300 200 C 380 150, 440 140, 505 108" stroke="#f4b400" stroke-opacity=".38" stroke-width="1.3"/>
      <path d="M300 200 C 370 240, 430 260, 492 288" stroke="#f4b400" stroke-opacity=".3" stroke-width="1.2"/>
      <path d="M300 200 C 350 280, 380 310, 424 350" stroke="#f4b400" stroke-opacity=".25" stroke-width="1"/>
      <path d="M300 200 C 300 130, 300 100, 300 52" stroke="#3b82f6" stroke-opacity=".3" stroke-width="1.1"/>
      <path d="M300 200 C 300 270, 300 300, 300 350" stroke="#3b82f6" stroke-opacity=".3" stroke-width="1.1"/>
      <path d="M96 118 C 130 80, 150 70, 178 62" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>
      <path d="M505 108 C 460 70, 430 60, 388 58" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>
      <path d="M110 292 C 160 330, 200 344, 246 348" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>
      <path d="M492 288 C 470 320, 450 336, 424 350" stroke="#ffffff" stroke-opacity=".08" stroke-width="1"/>
    </g>

    <!-- outer nodes -->
    <g filter="url(#aiGlow)">
      <circle cx="96" cy="118" r="7" fill="#f4b400"/>
      <circle cx="178" cy="62" r="5" fill="#60a5fa"/>
      <circle cx="300" cy="52" r="6" fill="#2dd4bf"/>
      <circle cx="388" cy="58" r="4" fill="#8a9ab5"/>
      <circle cx="505" cy="108" r="7" fill="#f4b400"/>
      <circle cx="110" cy="292" r="6" fill="#60a5fa"/>
      <circle cx="246" cy="348" r="4" fill="#8a9ab5"/>
      <circle cx="300" cy="350" r="5" fill="#2dd4bf"/>
      <circle cx="424" cy="350" r="6" fill="#60a5fa"/>
      <circle cx="492" cy="288" r="7" fill="#f4b400"/>
    </g>
    <!-- node halos -->
    <g fill="none" stroke-opacity=".18">
      <circle cx="96" cy="118" r="14" stroke="#f4b400"/>
      <circle cx="505" cy="108" r="14" stroke="#f4b400"/>
      <circle cx="492" cy="288" r="14" stroke="#f4b400"/>
      <circle cx="110" cy="292" r="12" stroke="#60a5fa"/>
      <circle cx="300" cy="52" r="11" stroke="#2dd4bf"/>
    </g>

    <!-- core -->
    <circle cx="300" cy="200" r="86" fill="url(#aiCore)" opacity=".22"/>
    <circle cx="300" cy="200" r="46" fill="none" stroke="#f4b400" stroke-opacity=".5" stroke-width="1.4" stroke-dasharray="3 6"/>
    <circle cx="300" cy="200" r="60" fill="none" stroke="#f4b400" stroke-opacity=".2" stroke-width="1"/>
    <circle cx="300" cy="200" r="30" fill="#0d1626" stroke="#f4b400" stroke-width="1.6"/>
    <g stroke="#ffce45" stroke-width="1.7" stroke-linecap="round" fill="none" filter="url(#aiGlow)">
      <path d="M288 206 L294 194 L300 210 L306 190 L312 202"/>
    </g>
    <!-- orbit dots -->
    <circle cx="346" cy="200" r="3.4" fill="#ffce45" filter="url(#aiGlow)"/>
    <circle cx="268" cy="163" r="2.6" fill="#60a5fa" filter="url(#aiGlow)"/>
    <circle cx="322" cy="252" r="2.4" fill="#2dd4bf" filter="url(#aiGlow)"/>

    <!-- floating chips -->
    <g font-family="Inter, system-ui, sans-serif">
      <rect x="42" y="152" width="96" height="26" rx="13" fill="#0d1626" stroke="#f4b400" stroke-opacity=".35"/>
      <text x="90" y="169" text-anchor="middle" font-size="10" fill="#f4b400" font-weight="700">ML FORECAST</text>
      <rect x="452" y="180" width="106" height="26" rx="13" fill="#0d1626" stroke="#60a5fa" stroke-opacity=".4"/>
      <text x="505" y="197" text-anchor="middle" font-size="10" fill="#60a5fa" font-weight="700">AUTOMATION</text>
      <rect x="252" y="88" width="96" height="26" rx="13" fill="#0d1626" stroke="#2dd4bf" stroke-opacity=".4"/>
      <text x="300" y="105" text-anchor="middle" font-size="10" fill="#2dd4bf" font-weight="700">GEN AI</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="599" height="399" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
