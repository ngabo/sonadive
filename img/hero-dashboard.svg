<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="hdPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <linearGradient id="hdGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4b400"/>
      <stop offset="1" stop-color="#ffce45"/>
    </linearGradient>
    <linearGradient id="hdArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4b400" stop-opacity=".32"/>
      <stop offset="1" stop-color="#f4b400" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hdAreaB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="hdGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <clipPath id="hdClip"><rect x="0" y="0" width="640" height="440" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#hdClip)">
    <rect width="640" height="440" fill="#0a1220"/>
    <!-- subtle grid -->
    <g stroke="#ffffff" stroke-opacity=".03">
      <path d="M0 55H640M0 110H640M0 165H640M0 220H640M0 275H640M0 330H640M0 385H640"/>
      <path d="M80 0V440M160 0V440M240 0V440M320 0V440M400 0V440M480 0V440M560 0V440"/>
    </g>
    <!-- ambient glows -->
    <circle cx="590" cy="30" r="180" fill="#f4b400" opacity=".05"/>
    <circle cx="40" cy="420" r="160" fill="#3b82f6" opacity=".05"/>

    <!-- window chrome -->
    <rect x="0" y="0" width="640" height="38" fill="#0d1626"/>
    <circle cx="22" cy="19" r="4.5" fill="#ff5f57"/>
    <circle cx="40" cy="19" r="4.5" fill="#febc2e"/>
    <circle cx="58" cy="19" r="4.5" fill="#28c840"/>
    <rect x="240" y="11" width="160" height="16" rx="8" fill="#ffffff" opacity=".05"/>
    <text x="320" y="23" text-anchor="middle" font-size="9" fill="#5a6a88" letter-spacing="1">SONADIVE · EXECUTIVE DASHBOARD</text>

    <!-- KPI row -->
    <g>
      <rect x="18" y="52" width="142" height="72" rx="10" fill="url(#hdPanel)" stroke="#ffffff" stroke-opacity=".07"/>
      <text x="32" y="73" font-size="8.5" fill="#5a6a88" font-weight="700" letter-spacing="1.2">REVENUE GROWTH</text>
      <text x="32" y="98" font-size="22" fill="#f0f4ff" font-weight="800">+12.4%</text>
      <text x="32" y="114" font-size="9" fill="#2dd4bf" font-weight="700">▲ vs plan</text>

      <rect x="172" y="52" width="142" height="72" rx="10" fill="url(#hdPanel)" stroke="#ffffff" stroke-opacity=".07"/>
      <text x="186" y="73" font-size="8.5" fill="#5a6a88" font-weight="700" letter-spacing="1.2">FORECAST ACCURACY</text>
      <text x="186" y="98" font-size="22" fill="#f4b400" font-weight="800">96.8%</text>
      <text x="186" y="114" font-size="9" fill="#2dd4bf" font-weight="700">▲ 3.1 pts</text>

      <rect x="326" y="52" width="142" height="72" rx="10" fill="url(#hdPanel)" stroke="#ffffff" stroke-opacity=".07"/>
      <text x="340" y="73" font-size="8.5" fill="#5a6a88" font-weight="700" letter-spacing="1.2">OPEX VARIANCE</text>
      <text x="340" y="98" font-size="22" fill="#f0f4ff" font-weight="800">-2.1%</text>
      <text x="340" y="114" font-size="9" fill="#60a5fa" font-weight="700">● under budget</text>

      <rect x="480" y="52" width="142" height="72" rx="10" fill="url(#hdPanel)" stroke="#ffffff" stroke-opacity=".07"/>
      <text x="494" y="73" font-size="8.5" fill="#5a6a88" font-weight="700" letter-spacing="1.2">PLAN ATTAINMENT</text>
      <text x="494" y="98" font-size="22" fill="#f0f4ff" font-weight="800">87.5%</text>
      <text x="494" y="114" font-size="9" fill="#2dd4bf" font-weight="700">▲ on track</text>
    </g>

    <!-- main chart -->
    <rect x="18" y="138" width="404" height="184" rx="12" fill="url(#hdPanel)" stroke="#ffffff" stroke-opacity=".07"/>
    <text x="34" y="162" font-size="10" fill="#aab4c4" font-weight="700">Revenue vs Forecast</text>
    <g font-size="8" fill="#4a5a78">
      <text x="366" y="162">● Actual</text>
      <text x="366" y="162" dx="-42" fill="#f4b400">●</text>
    </g>
    <g stroke="#ffffff" stroke-opacity=".05">
      <path d="M34 200H406M34 240H406M34 280H406"/>
    </g>
    <!-- blue forecast band -->
    <path d="M34 292 L86 284 L138 272 L190 276 L242 258 L294 250 L346 238 L398 224 L398 306 L34 306 Z" fill="url(#hdAreaB)"/>
    <path d="M34 292 L86 284 L138 272 L190 276 L242 258 L294 250 L346 238 L398 224" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" opacity=".8"/>
    <!-- gold actual -->
    <path d="M34 296 L86 280 L138 282 L190 262 L242 250 L294 232 L346 222 L398 198 L398 306 L34 306 Z" fill="url(#hdArea)"/>
    <path d="M34 296 L86 280 L138 282 L190 262 L242 250 L294 232 L346 222 L398 198" fill="none" stroke="url(#hdGold)" stroke-width="2.6" stroke-linecap="round" filter="url(#hdGlow)"/>
    <circle cx="398" cy="198" r="4.5" fill="#ffce45" filter="url(#hdGlow)"/>
    <rect x="352" y="176" width="66" height="20" rx="6" fill="#f4b400"/>
    <text x="385" y="189" text-anchor="middle" font-size="9.5" fill="#0a1220" font-weight="800">+9.2%</text>
    <g font-size="7.5" fill="#4a5a78">
      <text x="34" y="316">Q1</text><text x="138" y="316">Q2</text><text x="242" y="316">Q3</text><text x="346" y="316">Q4</text>
    </g>

    <!-- donut -->
    <rect x="434" y="138" width="188" height="184" rx="12" fill="url(#hdPanel)" stroke="#ffffff" stroke-opacity=".07"/>
    <text x="450" y="162" font-size="10" fill="#aab4c4" font-weight="700">Spend by Function</text>
    <g transform="translate(528 236)">
      <circle r="44" fill="none" stroke="#1a2740" stroke-width="13"/>
      <circle r="44" fill="none" stroke="#f4b400" stroke-width="13" stroke-dasharray="121 276" stroke-linecap="round" transform="rotate(-90)"/>
      <circle r="44" fill="none" stroke="#3b82f6" stroke-width="13" stroke-dasharray="72 276" stroke-dashoffset="-127" stroke-linecap="round" transform="rotate(-90)"/>
      <circle r="44" fill="none" stroke="#2dd4bf" stroke-width="13" stroke-dasharray="47 276" stroke-dashoffset="-205" stroke-linecap="round" transform="rotate(-90)"/>
      <text y="-2" text-anchor="middle" font-size="17" fill="#f0f4ff" font-weight="800">44%</text>
      <text y="13" text-anchor="middle" font-size="7.5" fill="#5a6a88" letter-spacing="1">OPS</text>
    </g>
    <g font-size="8" fill="#8a9ab5">
      <circle cx="456" cy="300" r="3" fill="#f4b400"/><text x="464" y="303">Ops 44%</text>
      <circle cx="516" cy="300" r="3" fill="#3b82f6"/><text x="524" y="303">R&amp;D 26%</text>
      <circle cx="576" cy="300" r="3" fill="#2dd4bf"/><text x="584" y="303">GTM 17%</text>
    </g>

    <!-- bottom bars -->
    <rect x="18" y="336" width="604" height="86" rx="12" fill="url(#hdPanel)" stroke="#ffffff" stroke-opacity=".07"/>
    <text x="34" y="358" font-size="10" fill="#aab4c4" font-weight="700">Demand Forecast — next 12 weeks</text>
    <g>
      <rect x="36" y="392" width="26" height="20" rx="3" fill="#22344f"/>
      <rect x="82" y="386" width="26" height="26" rx="3" fill="#22344f"/>
      <rect x="128" y="380" width="26" height="32" rx="3" fill="#22344f"/>
      <rect x="174" y="388" width="26" height="24" rx="3" fill="#22344f"/>
      <rect x="220" y="376" width="26" height="36" rx="3" fill="#22344f"/>
      <rect x="266" y="372" width="26" height="40" rx="3" fill="#22344f"/>
      <rect x="312" y="378" width="26" height="34" rx="3" fill="url(#hdGold)"/>
      <rect x="358" y="370" width="26" height="42" rx="3" fill="url(#hdGold)"/>
      <rect x="404" y="366" width="26" height="46" rx="3" fill="url(#hdGold)"/>
      <rect x="450" y="372" width="26" height="40" rx="3" fill="url(#hdGold)" opacity=".75"/>
      <rect x="496" y="362" width="26" height="50" rx="3" fill="url(#hdGold)" opacity=".6"/>
      <rect x="542" y="356" width="26" height="56" rx="3" fill="url(#hdGold)" opacity=".45"/>
      <rect x="588" y="360" width="26" height="52" rx="3" fill="url(#hdGold)" opacity=".3"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="639" height="439" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
